name: Update Badevannskvalitet

# Refreshes the water quality in src/badeplasser/badeplasser.json by re-scraping
# the Oslo kommune detail pages, and opens a pull request when anything changed.
# Water quality is sampled from June to August, so this runs daily through the
# bathing season; it can also be triggered manually at any time.
#
# Requires the repository setting
#   Settings → Actions → General → "Allow GitHub Actions to create and approve
#   pull requests"
# to be enabled, so the built-in GITHUB_TOKEN may open the PR.

on:
  schedule:
    # 05:00 UTC (07:00 Oslo) every day, May–September.
    - cron: "0 5 * 5-9 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: saga

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Update water quality
        run: npm run badeplasser:update

      - name: Open pull request with the changes
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: saga
          branch: data/update-badevannskvalitet
          add-paths: src/badeplasser/badeplasser.json
          # `fix:` makes semantic-release cut a patch release on merge, which
          # deploys the refreshed data to the site.
          commit-message: "fix: update badevannskvalitet"
          title: "fix: update badevannskvalitet"
          body: |
            Automated refresh of the bathing water quality in
            `src/badeplasser/badeplasser.json`, scraped from the Oslo kommune
            beach pages by `npm run badeplasser:update`.

            Only the water quality (and temperature) changed — name, location
            and facilities are preserved. Review the diff and merge to deploy.
          labels: badevannskvalitet
          delete-branch: true
