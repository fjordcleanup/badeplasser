name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [Test and Release]
    types: [completed]
    branches: [saga]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pages: write
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    if:
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'saga') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Determine source run ID
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            RUN_ID=$(gh run list --workflow="Test and Release" --branch=saga --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for release artifact
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ARTIFACT_ID=$(gh api repos/$GH_REPO/actions/runs/${{ steps.source.outputs.run_id }}/artifacts --jq '.artifacts[] | select(.name == "build") | .id // empty')
          echo "has_release=$([ -n "$ARTIFACT_ID" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Download build artifact
        if: steps.check.outputs.has_release == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          path: ./build
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        if: steps.check.outputs.has_release == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.has_release == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
